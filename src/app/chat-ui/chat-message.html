<div
  class="message-row"
  [class.user]="message().role === 'user'"
  [class.assistant]="message().role === 'assistant'"
  [class.system]="message().role === 'system'"
>
  <div class="bubble">
    @if (message().role === 'assistant') {
      <app-answer-reveal
        [text]="message().text"
        [animate]="message().reveal === true"
        (advanced)="revealAdvanced.emit()"
      />
    } @else {
      <p class="msg-text">{{ message().text }}</p>
    }

    <app-chat-message-meta [message]="message()" />

    <div class="msg-meta">
      <small>{{ formatTime(message().timestamp) }}</small>
    </div>
  </div>

  @if (message().role === 'assistant') {
    <div class="message-actions">
      <button
        type="button"
        class="ghost icon-only small"
        (click)="openDetails.emit(message())"
        title="Answer details"
        aria-label="Answer details"
      >
        <app-icon name="info" [size]="14" />
      </button>
      <button
        type="button"
        class="ghost icon-only small"
        (click)="service.copyMessage(message())"
        title="Copy answer"
        aria-label="Copy answer"
      >
        <app-icon name="copy" [size]="14" />
      </button>
      @if (canRate()) {
        <button
          type="button"
          class="ghost icon-only small"
          (click)="service.likeMessage(message())"
          title="Good answer"
          aria-label="Good answer"
        >
          <app-icon name="thumb-up" [size]="14" />
        </button>
        <button
          type="button"
          class="ghost icon-only small"
          (click)="service.dislikeMessage(message())"
          title="Wrong answer"
          aria-label="Wrong answer"
        >
          <app-icon name="thumb-down" [size]="14" />
        </button>
      }
    </div>
  }
</div>
