@if (visible()) {
  <div class="slash_menu" #menu>
    <div class="slash_menu_header">Tools</div>
    @for (tool of filteredTools(); track tool.name) {
      <button
        type="button"
        class="slash_menu_item"
        [class.selected]="selectedIndex() === $index"
        (click)="selectTool(tool)"
        (mouseenter)="selectedIndex.set($index)"
      >
        <div class="slash_menu_item_icon">
          <app-icon name="wand" [size]="16" />
        </div>
        <div class="slash_menu_item_content">
          <div class="slash_menu_item_name">/{{ tool.name }}</div>
          <div class="slash_menu_item_desc">{{ tool.description }}</div>
        </div>
        @if (tool.requires_confirmation) {
          <span class="slash_menu_badge">Confirm</span>
        }
      </button>
    }
    @if (filteredTools().length === 0) {
      <div class="slash_menu_empty">No matching tools</div>
    }
  </div>
}
