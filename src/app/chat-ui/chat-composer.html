<footer class="composer">
  <app-slash-menu
    [visible]="slashMenuVisible()"
    [query]="slashQuery()"
    [tools]="availableTools()"
    (toolSelected)="onToolSelected($event)"
    (dismissed)="closeSlashMenu()"
  />

  <div class="composer-inner">
    <div class="composer-box" [class.answering]="service.isTyping()">
      <textarea
        #input
        class="composer-input"
        rows="2"
        [placeholder]="'Message ' + prefs.botName() + '…'"
        [value]="draft()"
        (input)="onInput($any($event.target))"
        (keydown)="onKeydown($event)"
        aria-label="Message input"
      ></textarea>

      <div class="composer-tools">
        <div class="tools-start">
          <details class="composer-menu" #menu>
            <summary
              class="tool-btn"
              [class.disabled]="service.isTyping()"
              aria-label="Add new chat or configure"
              title="Add new chat or configure"
            >
              <app-icon name="plus" [size]="16" />
            </summary>
            <div class="composer-menu-list">
              <button type="button" class="menu-item" (click)="newChat(); menu.open = false">
                <app-icon name="file" [size]="14" />
                <span>New chat</span>
              </button>
              <button
                type="button"
                class="menu-item"
                (click)="comingSoon('Connect plugin'); menu.open = false"
              >
                <app-icon name="external" [size]="14" />
                <span>Connect plugin</span>
              </button>
              <button
                type="button"
                class="menu-item"
                (click)="comingSoon('Add skills'); menu.open = false"
              >
                <app-icon name="play" [size]="14" />
                <span>Add skills</span>
              </button>
              <button
                type="button"
                class="menu-item"
                (click)="comingSoon('Set goal'); menu.open = false"
              >
                <app-icon name="pin" [size]="14" />
                <span>Set goal</span>
              </button>
            </div>
          </details>

          <button
            type="button"
            class="tool-btn context-toggle"
            (click)="toggleContext()"
            [class.active]="integrations.contextEnabled()"
            [attr.aria-label]="
              integrations.contextEnabled() ? 'Context enabled' : 'Context disabled'
            "
            [title]="
              integrations.contextEnabled()
                ? 'Following previous questions'
                : 'Each question is independent'
            "
          >
            <app-icon name="layers" [size]="14" />
          </button>
        </div>

        <div class="tools-end">
          <button
            type="button"
            class="tool-btn voice-toggle"
            (click)="toggleVoice()"
            [class.active]="voice.enabled()"
            [attr.aria-label]="voice.enabled() ? 'Voice mode on' : 'Voice mode off'"
            [title]="voice.enabled() ? 'Voice mode on · replies speak' : 'Voice mode off'"
          >
            <app-icon name="volume" [size]="14" />
          </button>

          <button
            type="button"
            class="tool-btn mic-btn"
            (mousedown)="startListening()"
            (mouseup)="stopListening()"
            (mouseleave)="stopListening()"
            [class.recording]="voice.isRecording()"
            [attr.aria-label]="'Hold to record'"
            title="Hold to speak"
          >
            <app-icon name="mic" [size]="14" />
          </button>

          <label
            class="model-pill"
            [title]="models.error() || 'The model that answers the next message'"
          >
            <app-icon name="layers" [size]="13" />
            <select
              class="model-select"
              [value]="models.selectedId()"
              (change)="models.select($any($event.target).value)"
              aria-label="Model that answers"
            >
              @for (model of models.models(); track model.id) {
                <option
                  [value]="model.id"
                  [selected]="model.id === models.selectedId()"
                  [disabled]="!model.ready"
                >
                  {{ model.name }}{{ model.ready ? '' : ' (not trained)' }}
                </option>
              }
            </select>
            <app-icon name="chevron-down" [size]="12" class="chev" />
          </label>

          @if (service.isTyping()) {
            <button
              type="button"
              class="stop-btn"
              (click)="stop()"
              title="Stop the answer"
              aria-label="Stop answering"
            >
              <app-icon name="stop" [size]="14" />
            </button>
          } @else {
            <button
              type="button"
              class="send-btn"
              (click)="send()"
              [disabled]="!draft().trim()"
              aria-label="Send message"
              title="Send message · Enter"
            >
              <app-icon name="arrow-up" [size]="17" />
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</footer>
