<aside
  id="app-chat-sidebar"
  class="sidebar"
  aria-label="Conversations"
  [attr.inert]="design.sidebarOpen() ? null : ''"
>
  <button
    type="button"
    class="new-chat"
    (click)="session.newChat(); design.handleNavigation()"
    aria-label="New chat"
    title="New chat"
  >
    <span class="plus" aria-hidden="true">
      <app-icon name="plus" [size]="14" />
    </span>
    <span class="new-chat-label">New chat</span>
  </button>

  <p class="list-label" [hidden]="!design.sidebarOpen()">Chats</p>

  <div class="session-list" [hidden]="!design.sidebarOpen()">
    @for (item of session.sessions(); track item.id) {
      <div
        class="session-item"
        role="button"
        tabindex="0"
        [class.active]="item.id === session.activeId()"
        (click)="session.selectSession(item.id); design.handleNavigation()"
        (keydown.enter)="session.selectSession(item.id); design.handleNavigation()"
      >
        <div class="session-title">{{ item.title }}</div>
        <button
          type="button"
          class="session-del"
          (click)="session.deleteSession(item.id); $event.stopPropagation()"
          aria-label="Delete chat"
          title="Delete chat"
        >
          <app-icon name="x" [size]="12" />
        </button>
      </div>
    }
  </div>

  <div class="sidebar-footer">
    <div class="status" [hidden]="!design.sidebarOpen()">
      <span
        class="dot"
        [class.online]="service.backendStatus() === 'online'"
        [class.offline]="service.backendStatus() === 'offline'"
      ></span>
      @switch (service.backendStatus()) {
        @case ('online') {
          Connected
        }
        @case ('offline') {
          Offline
        }
        @default {
          Connecting…
        }
      }
    </div>
  </div>
</aside>
