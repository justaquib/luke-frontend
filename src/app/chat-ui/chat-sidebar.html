<aside class="sidebar">
  <div class="sidebar-header">
    <a class="brand" routerLink="/" title="Back to home" [hidden]="!ui.sidebarOpen()">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <defs>
            <linearGradient id="sb-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#sb-g)" />
          <path
            d="M9 12c0-1.5 1-3 3-3h8c2 0 3 1.5 3 3v6c0 1.5-1 3-3 3h-5l-3 3v-3h-0c-2 0-3-1.5-3-3z"
            fill="#fff"
            opacity="0.96"
          />
          <circle cx="13" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="17" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="21" cy="15" r="1.2" fill="#6366f1" />
        </svg>
      </span>
      <span class="brand-name">{{ prefs.botName() }}</span>
    </a>
  </div>

  <button type="button" class="new-chat" (click)="session.newChat()">
    <span class="plus">+</span>
    <span [hidden]="!ui.sidebarOpen()">New chat</span>
  </button>

  <div class="session-list" [hidden]="!ui.sidebarOpen()">
    @for (item of session.sessions(); track item.id) {
      <div
        class="session-item"
        role="button"
        tabindex="0"
        [class.active]="item.id === session.activeId()"
        (click)="session.selectSession(item.id)"
        (keydown.enter)="session.selectSession(item.id)"
      >
        <div class="session-title">{{ item.title }}</div>
        <button
          type="button"
          class="session-del"
          (click)="session.deleteSession(item.id); $event.stopPropagation()"
          aria-label="Delete chat"
        >
          ×
        </button>
      </div>
    }
  </div>

  <div class="sidebar-footer">
    @if (isSystemAdmin()) {
      <a class="nav-action" routerLink="/systemadmin" title="System Admin Dashboard">
        <span class="nav-action__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path
              d="M12 3l1.5 4.5L18 9l-4.5 1.5L15 15l-3-2.5L9 15l1.5-4.5L6 9l4.5-1.5z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span>System Admin</span>
      </a>
    }
    <div class="status" [hidden]="!ui.sidebarOpen()">
      <span
        class="dot"
        [class.online]="service.backendStatus() === 'online'"
        [class.offline]="service.backendStatus() === 'offline'"
      ></span>
      @switch (service.backendStatus()) {
        @case ('online') {
          Connected
        }
        @case ('offline') {
          Offline
        }
        @default {
          Connecting…
        }
      }
    </div>
  </div>
</aside>
