@if (message().source) {
  <p class="provenance">
    <span class="provenance-label">Source</span>
    <span class="provenance-value" [class.pending]="message().source === 'pending'">
      {{ sourceLabel() }}
    </span>
  </p>
}
@if (hasDisabledSources()) {
  <small class="source-hint">
    Live answers are off.
    <a routerLink="/dashboard/settings">
      Enable {{ message().disabledExternalSources?.join(' and ') }} in Settings</a
    >
  </small>
}
