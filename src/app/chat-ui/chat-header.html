<header class="chat-header">
  <div class="title-wrap">
    <button
      type="button"
      class="icon-btn sidebar-toggle"
      (click)="toggleSidebar()"
      [attr.aria-label]="ui.sidebarOpen() ? 'Hide sidebar' : 'Show sidebar'"
      [attr.aria-expanded]="ui.sidebarOpen()"
      title="Toggle sidebar"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path
          d="M3 6h18M3 12h18M3 18h18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <h1
      class="editable-title"
      [class.editing]="titleEditing()"
      (click)="startEditTitle()"
      (keydown.enter)="startEditTitle()"
      [attr.tabindex]="titleEditing() ? -1 : 0"
      [attr.role]="titleEditing() ? null : 'button'"
    >
      @if (titleEditing()) {
        <input
          #titleInput
          type="text"
          class="title-input"
          [value]="titleDraft()"
          (input)="titleDraft.set($any($event.target).value)"
          (keydown)="onTitleKeydown($event)"
          (blur)="commitTitle()"
          maxlength="80"
          aria-label="Chat title"
        />
      } @else {
        <span class="title-text">{{ session.active().title }}</span>
        <span class="title-edit-hint" aria-hidden="true">✎</span>
      }
    </h1>
    <span class="mode-pill" [class.train]="session.trainMode()">
      @if (session.trainMode()) {
        Train mode
      } @else {
        Regular
      }
    </span>
    @if (!ui.sidebarOpen()) {
      <span
        class="status-dot"
        [class.online]="service.backendStatus() === 'online'"
        [class.offline]="service.backendStatus() === 'offline'"
        [attr.title]="
          service.backendStatus() === 'online'
            ? 'Backend connected'
            : service.backendStatus() === 'offline'
              ? 'Backend offline'
              : 'Connecting…'
        "
      ></span>
    }
  </div>
  <div class="header-actions">
    <button
      type="button"
      class="train-toggle"
      [class.on]="session.trainMode()"
      (click)="toggleTrain()"
    >
      @if (session.trainMode()) {
        ◉ Train
      } @else {
        ○ Train
      }
    </button>
    <a class="icon-btn" routerLink="/settings" aria-label="Settings" title="Settings"> ⚙ </a>
  </div>
</header>
