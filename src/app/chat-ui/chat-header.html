<header class="chat-header">
  <div class="title-wrap">
    <div class="title-block">
      <span class="context-label">Conversation engine</span>
      <h1
        class="editable-title"
        [class.editing]="titleEditing()"
        (click)="startEditTitle()"
        (keydown.enter)="startEditTitle()"
        [attr.tabindex]="titleEditing() ? -1 : 0"
        [attr.role]="titleEditing() ? null : 'button'"
      >
        @if (titleEditing()) {
          <input
            #titleInput
            type="text"
            class="title-input"
            [value]="titleDraft()"
            (input)="titleDraft.set($any($event.target).value)"
            (keydown)="onTitleKeydown($event)"
            (blur)="commitTitle()"
            maxlength="80"
            aria-label="Chat title"
          />
        } @else {
          <span class="title-text">{{ session.active().title }}</span>
          <span class="title-edit-hint" aria-hidden="true">
            <app-icon name="pencil" [size]="12" />
          </span>
        }
      </h1>
    </div>
  </div>
  <div class="header-actions">
    <span
      class="engine-status"
      [attr.title]="
        service.backendStatus() === 'online'
          ? 'Backend connected'
          : service.backendStatus() === 'offline'
            ? 'Backend offline'
            : 'Connecting…'
      "
    >
      <span
        class="dot"
        [class.ok]="service.backendStatus() === 'online'"
        [class.bad]="service.backendStatus() === 'offline'"
      ></span>
      @switch (service.backendStatus()) {
        @case ('online') {
          Engine online
        }
        @case ('offline') {
          Engine offline
        }
        @default {
          Connecting…
        }
      }
    </span>
    <a class="icon-btn" routerLink="/dashboard/settings" aria-label="Settings" title="Settings">
      <app-icon name="sliders" [size]="16" />
    </a>
  </div>
</header>
