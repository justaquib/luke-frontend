<div
  class="shell"
  [class.train-on]="session.trainMode()"
  [class.sidebar-collapsed]="!ui.sidebarOpen()"
>
  <app-chat-sidebar />

  <main class="chat-area">
    <app-chat-header />

    @if (session.trainMode()) {
      <div class="train-banner">
        <strong>Train mode is on.</strong>
        Click ✏️ on any assistant message to correct the answer.
      </div>
    }

    <app-chat-messages />
    <app-chat-composer />
  </main>
</div>
