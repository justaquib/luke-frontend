<div
  class="shell"
  [class.sidebar-collapsed]="!design.sidebarOpen()"
  [class.sidebar-open]="design.sidebarOpen()"
  [attr.data-sidebar-side]="design.sidebarSide()"
  [attr.data-sidebar-mode]="design.sidebarMode()"
>
  <app-top-bar navControls="app-chat-sidebar" />
  <app-chat-sidebar />

  <main class="chat-area">
    <app-chat-messages (openDetails)="showAnswer($event)" />
    <app-chat-composer />
  </main>

  <div class="sidebar-scrim" role="presentation" (click)="design.closeSidebar()"></div>
</div>

<app-right-sidebar />

<ng-template #answerDetails>
  @if (selectedAnswer(); as answer) {
    <app-chat-answer-details [message]="answer.message" [question]="answer.question" />
  }
</ng-template>

<ng-template appPageInfoFacts>
  <h3 class="eyebrow">This conversation</h3>
  <app-engine-facts [facts]="facts()" label="Conversation engine state" />
</ng-template>
