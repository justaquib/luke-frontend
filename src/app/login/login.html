<div class="login-page">
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="36" height="36">
          <defs>
            <linearGradient id="bm-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bm-g)" />
          <path
            d="M9 12c0-1.5 1-3 3-3h8c2 0 3 1.5 3 3v6c0 1.5-1 3-3 3h-5l-3 3v-3h-0c-2 0-3-1.5-3-3z"
            fill="#fff"
            opacity="0.96"
          />
          <circle cx="13" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="17" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="21" cy="15" r="1.2" fill="#6366f1" />
        </svg>
      </span>
      <span class="brand-name">Assistance</span>
    </div>

    <div class="login-header">
      <h1>Welcome back</h1>
      <p class="login-lead">Sign in to continue to your assistant and trainer.</p>
    </div>

    <button class="google-btn" (click)="googleSignIn()">
      <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path
          fill="#4285F4"
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
        />
        <path
          fill="#34A853"
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
        />
        <path
          fill="#FBBC05"
          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
        />
        <path
          fill="#EA4335"
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
        />
      </svg>
      <span>Continue with Google</span>
    </button>

    <a routerLink="/systemadmin" class="back-link">System admin login</a>
    <a routerLink="/" class="back-link">← Back to home</a>
  </div>
</div>
