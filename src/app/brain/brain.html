<app-shell>
  <main class="builder">
    <ng-template appTopBarActions>
      <button
        type="button"
        class="icon-btn train-button top-train"
        (click)="trainBrain()"
        [disabled]="brainTraining()"
        [attr.aria-label]="brainTraining() ? 'Training the brain' : 'Train the brain'"
        [title]="brainTraining() ? 'Training the brain' : 'Train the brain'"
      >
        <app-icon name="play" [size]="15" />
      </button>
    </ng-template>

    <ng-template appPageInfoActions>
      <div class="header-controls">
        <span class="engine-status" aria-live="polite">
          <span class="dot" [class]="statusClass()" aria-hidden="true"></span>
          {{ status() }}
        </span>
        <button
          type="button"
          class="icon-btn"
          (click)="showSources()"
          aria-label="Show what the brain trains from"
          title="Show what the brain trains from"
        >
          <app-icon name="book" [size]="16" />
        </button>
      </div>
    </ng-template>

    <div class="builder-body">
      @if (error(); as message) {
        <p class="page-error" role="alert">{{ message }}</p>
      }

      <div class="builder-grid">
        <div class="builder-column">
          <app-brain-engine
            [engine]="engine()"
            [training]="brainTraining()"
            [progress]="progress()"
          />
          <app-brain-models [answer]="answer()" [words]="words()" />
        </div>
        <div class="builder-column">
          <app-brain-measurements [level]="level()" />
          <app-brain-runs [runs]="runs()" />
        </div>
      </div>

      <section class="panel corpus" aria-labelledby="corpus-title">
        <header class="panel-head">
          <h2 id="corpus-title">Corpus</h2>
          <span class="stamp">{{ loading() ? 'reading…' : 'as trained' }}</span>
        </header>
        <dl class="corpus-rows">
          @for (row of corpusRows(); track row.label) {
            <div class="corpus-row">
              <dt>{{ row.label }}</dt>
              <dd>{{ row.value }}</dd>
            </div>
          }
        </dl>
      </section>

      <app-brain-store />

      <app-brain-ladder
        [level]="level()"
        [testing]="brainTesting()"
        [approving]="brainApproving()"
        (test)="testLevel()"
        (approve)="approveLevel()"
      />
    </div>
  </main>

  <ng-template #trainingDetails>
    <app-brain-training-panel [state]="brainState()" />
  </ng-template>
</app-shell>
