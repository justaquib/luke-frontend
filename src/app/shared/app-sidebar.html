<aside class="sidebar" aria-label="Main navigation">
  <div class="sidebar-header">
    <a class="brand" routerLink="/chat" title="Go to chat">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <defs>
            <linearGradient id="app-brand-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#app-brand-gradient)" />
          <path d="M9 12c0-1.5 1-3 3-3h8c2 0 3 1.5 3 3v6c0 1.5-1 3-3 3h-5l-3 3v-3c-2 0-3-1.5-3-3z" fill="#fff" />
          <circle cx="13" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="17" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="21" cy="15" r="1.2" fill="#6366f1" />
        </svg>
      </span>
      @if (open()) { <span class="brand-name">{{ botName() }}</span> }
    </a>
  </div>

  <a class="new-chat" routerLink="/chat">
    <span class="plus" aria-hidden="true">＋</span>
    @if (open()) { <span>Open chat</span> }
  </a>

  <nav class="nav-list" aria-label="Workspace">
    <a class="nav-item" routerLink="/chat" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v9A2.5 2.5 0 0 1 18.5 18H8l-4 4v-4H5.5A2.5 2.5 0 0 1 3 15.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      @if (open()) { <span class="nav-label">Chat</span> }
    </a>
    <a class="nav-item" routerLink="/trainer" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </span>
      @if (open()) { <span class="nav-label">Training room</span> }
    </a>
    <a class="nav-item" routerLink="/learner" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      @if (open()) { <span class="nav-label">Language Learner</span> }
    </a>
    <a class="nav-item" routerLink="/brain" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M9 3a3 3 0 0 0-3 3v1a3 3 0 0 0-3 3 3 3 0 0 0 3 3v1a3 3 0 0 0 3 3M15 3a3 3 0 0 1 3 3v1a3 3 0 0 1 3 3 3 3 0 0 1-3 3v1a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      @if (open()) { <span class="nav-label">Assistance Brain</span> }
    </a>
    <a class="nav-item" routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      @if (open()) { <span class="nav-label">Settings</span> }
    </a>
    @if (isSystemAdmin()) {
      <a class="nav-item" routerLink="/tenants" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L15 15l-3-2.5L9 15l1.5-4.5L6 9l4.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        @if (open()) { <span class="nav-label">System Admin</span> }
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <button
      type="button"
      class="icon-btn sidebar-toggle"
      (click)="toggle()"
      [attr.aria-label]="open() ? 'Hide sidebar' : 'Show sidebar'"
      [attr.aria-expanded]="open()"
      title="Toggle sidebar"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
  </div>
</aside>
