<aside
  id="app-sidebar"
  class="sidebar"
  aria-label="Main navigation"
  [attr.inert]="open() ? null : ''"
>
  <a class="new-chat" routerLink="/chat" (click)="design.handleNavigation()" title="Open chat">
    <app-icon name="plus" [size]="14" />
    @if (open()) {
      <span>Open chat</span>
    }
  </a>

  <nav class="nav-list" aria-label="Workspace">
    @for (item of navItems(); track item.path) {
      <a
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="design.handleNavigation()"
        [title]="item.label"
      >
        <span class="nav-icon" aria-hidden="true">
          <app-icon [name]="item.icon" [size]="18" />
        </span>
        @if (open()) {
          <span class="nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    @if (open()) {
      <div class="view-options">
        <p class="options-label">Sidebar view</p>
        <div class="option-row" role="group" aria-label="Sidebar behaviour">
          @for (mode of modes; track mode.value) {
            <button
              type="button"
              class="icon-btn option"
              [class.active]="design.sidebarMode() === mode.value"
              (click)="design.setSidebarMode(mode.value)"
              [attr.aria-pressed]="design.sidebarMode() === mode.value"
              [attr.aria-label]="mode.label"
              [title]="mode.label"
            >
              <app-icon [name]="mode.icon" [size]="15" />
            </button>
          }
        </div>
      </div>
    }
    <app-background-task-strip />
  </div>
</aside>
