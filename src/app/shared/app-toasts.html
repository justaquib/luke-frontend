@if (ui.toasts().length > 0) {
  <section class="toasts" aria-label="Notifications">
    @for (toast of ui.toasts(); track toast.id) {
      <div
        class="toast"
        [class.success]="toast.kind === 'success'"
        [class.error]="toast.kind === 'error'"
        [class.info]="toast.kind === 'info'"
        [attr.role]="toast.kind === 'error' ? 'alert' : 'status'"
      >
        <span class="toast-icon" aria-hidden="true">
          <app-icon [name]="iconFor(toast.kind)" [size]="14" />
        </span>
        <span class="toast-message">{{ toast.message }}</span>
        <button
          type="button"
          class="toast-close"
          (click)="ui.dismissToast(toast.id)"
          aria-label="Dismiss notification"
          title="Dismiss notification"
        >
          <app-icon name="x" [size]="12" />
        </button>
      </div>
    }
  </section>
}
