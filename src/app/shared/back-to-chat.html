<button
  type="button"
  class="back-to-chat"
  [class.has-history]="canGoBack()"
  (click)="goBack()"
  title="Back to chat"
  aria-label="Back to chat"
>
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path
      d="M15 18l-6-6 6-6"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <span>Back to chat</span>
</button>
