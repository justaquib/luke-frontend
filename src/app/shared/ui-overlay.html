@if (ui.confirm(); as c) {
  <app-modal [open]="true" [title]="c.title" (closed)="cancel()">
    <p class="confirm-message">{{ c.message }}</p>
    <div modal-actions>
      <button type="button" class="ghost" (click)="cancel()">
        {{ c.cancelLabel }}
      </button>
      <button type="button" class="primary" [class.danger]="c.danger" (click)="ok()">
        {{ c.confirmLabel }}
      </button>
    </div>
  </app-modal>
}
