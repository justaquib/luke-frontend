<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <a class="brand" routerLink="/" title="Back to home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22">
            <defs>
              <linearGradient id="tn-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6366f1" />
                <stop offset="1" stop-color="#a855f7" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#tn-g)" />
            <path
              d="M9 12c0-1.5 1-3 3-3h8c2 0 3 1.5 3 3v6c0 1.5-1 3-3 3h-5l-3 3v-3h-0c-2 0-3-1.5-3-3z"
              fill="#fff"
              opacity="0.96"
            />
            <circle cx="13" cy="15" r="1.2" fill="#6366f1" />
            <circle cx="17" cy="15" r="1.2" fill="#6366f1" />
            <circle cx="21" cy="15" r="1.2" fill="#6366f1" />
          </svg>
        </span>
        <span class="brand-name">Assistance</span>
      </a>
    </div>

    <nav class="nav-list">
      <a
        class="nav-item"
        routerLink="/chat"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path
              d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v9A2.5 2.5 0 0 1 18.5 18H8l-4 4v-4H5.5A2.5 2.5 0 0 1 3 15.5z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <path
              d="M7 9h10M7 12h7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span class="nav-label">Chat</span>
      </a>

      <a
        class="nav-item"
        routerLink="/trainer"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path
              d="M12 3l1.5 4.5L18 9l-4.5 1.5L15 15l-3-2.5L9 15l1.5-4.5L6 9l4.5-1.5z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="nav-label">Trainer</span>
      </a>

      <a
        class="nav-item nav-item-primary"
        routerLink="/tenants"
        routerLinkActive="active"
        [attr.aria-current]="isActive('/tenants') ? 'page' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path
              d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M23 21v-2a4 4 0 0 0-3-3.87"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M16 3.13a4 4 0 0 1 0 7.75"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="nav-label">Tenants</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="back-link" routerLink="/login">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path
            d="M15 18l-6-6 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Back to login
      </a>
    </div>
  </aside>

  <main class="tenants-area">
    <header class="tenants-header">
      <div class="title-wrap">
        <h1>Tenants</h1>
        <p class="subtitle">System admin view of all tenants.</p>
      </div>
      <div class="header-actions">
        <span class="badge tenant-count" [title]="tenants.length + ' tenant(s)'">
          {{ tenants.length }} tenant{{ tenants.length === 1 ? '' : 's' }}
        </span>
        <button
          type="button"
          class="icon-btn"
          (click)="refresh()"
          aria-label="Refresh"
          title="Refresh"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>

    <section class="tenants-content">
      <div class="tenants-list">
        <div class="tenant-item" *ngFor="let tenant of tenants">
          <div class="tenant-info">
            <div class="tenant-name">{{ tenant.name }}</div>
            <div class="tenant-meta">Slug: {{ tenant.slug }}</div>
            <div class="tenant-meta">ID: {{ tenant.id }}</div>
          </div>
          <div class="tenant-date">{{ tenant.created_at | date: 'medium' }}</div>
        </div>
        <div class="empty-state" *ngIf="!tenants.length">
          No tenants found.
        </div>
      </div>
    </section>
  </main>
</div>
