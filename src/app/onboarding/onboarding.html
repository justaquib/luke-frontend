<div class="auth-page">
  <section class="auth-card wide" aria-labelledby="onboarding-title">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true"><app-icon name="logo" [size]="18" /></span>
      <span>Assistance</span>
    </div>

    <header class="auth-header">
      <h1 id="onboarding-title">What brings you here?</h1>
      <p class="auth-lead">Choose the experience that fits you best. You can switch later.</p>
    </header>

    <div class="choice-grid">
      <button type="button" class="choice-card" (click)="chooseTrainer()">
        <span class="choice-icon" aria-hidden="true"><app-icon name="book" [size]="16" /></span>
        <h2>I want to train the assistant</h2>
        <p>Review questions, approve answers, and improve the knowledge base.</p>
        <span class="choice-cta">
          Open Trainer
          <app-icon name="arrow-right" [size]="14" />
        </span>
      </button>

      <button type="button" class="choice-card" (click)="chooseChat()">
        <span class="choice-icon" aria-hidden="true"><app-icon name="send" [size]="16" /></span>
        <h2>I just want to chat</h2>
        <p>Ask questions and get answers from the trained assistant.</p>
        <span class="choice-cta">
          Open Chat
          <app-icon name="arrow-right" [size]="14" />
        </span>
      </button>
    </div>
  </section>
</div>
