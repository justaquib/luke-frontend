<div class="onboarding-page">
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
  <div class="onboarding-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="36" height="36">
          <defs>
            <linearGradient id="bm-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bm-g)" />
          <path
            d="M9 12c0-1.5 1-3 3-3h8c2 0 3 1.5 3 3v6c0 1.5-1 3-3 3h-5l-3 3v-3h-0c-2 0-3-1.5-3-3z"
            fill="#fff"
            opacity="0.96"
          />
          <circle cx="13" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="17" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="21" cy="15" r="1.2" fill="#6366f1" />
        </svg>
      </span>
      <span class="brand-name">Assistance</span>
    </div>

    <div class="onboarding-header">
      <h1>What brings you here?</h1>
      <p class="onboarding-lead">Choose the experience that fits you best. You can switch later.</p>
    </div>

    <div class="choice-grid">
      <button class="choice-card" (click)="chooseTrainer()">
        <div class="choice-icon" aria-hidden="true">🧑‍🏫</div>
        <h2>I want to train the assistant</h2>
        <p>Review questions, approve answers, and improve the knowledge base.</p>
        <span class="choice-cta">Open Trainer →</span>
      </button>

      <button class="choice-card" (click)="chooseChat()">
        <div class="choice-icon" aria-hidden="true">💬</div>
        <h2>I just want to chat</h2>
        <p>Ask questions and get answers from the trained assistant.</p>
        <span class="choice-cta">Open Chat →</span>
      </button>
    </div>
  </div>
</div>
