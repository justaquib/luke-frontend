<aside class="sidebar">
  <div class="sidebar-header">
    <a class="brand" routerLink="/" title="Back to home" [hidden]="!sidebarOpen()">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <defs>
            <linearGradient id="tr-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#tr-g)" />
          <path
            d="M9 12c0-1.5 1-3 3-3h8c2 0 3 1.5 3 3v6c0 1.5-1 3-3 3h-5l-3 3v-3h-0c-2 0-3-1.5-3-3z"
            fill="#fff"
            opacity="0.96"
          />
          <circle cx="13" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="17" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="21" cy="15" r="1.2" fill="#6366f1" />
        </svg>
      </span>
      <span class="brand-name">{{ prefs.botName() }} · Trainer</span>
    </a>
  </div>

  <nav class="nav-list gap-2!">
    <button
      type="button"
      class="nav-item nav-item-primary"
      [class.active]="store.tab() === 'new'"
      (click)="store.setTab('new')"
      [attr.aria-current]="store.tab() === 'new' ? 'page' : null"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M12 5v14M5 12h14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="nav-label" [hidden]="!sidebarOpen()">New Q&amp;A</span>
    </button>
    <button
      type="button"
      class="nav-item"
      [class.active]="store.tab() === 'inbox'"
      (click)="store.setTab('inbox')"
      [attr.aria-current]="store.tab() === 'inbox' ? 'page' : null"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v9A2.5 2.5 0 0 1 18.5 18H8l-4 4v-4H5.5A2.5 2.5 0 0 1 3 15.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M7 9h10M7 12h7"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="nav-label" [hidden]="!sidebarOpen()">Inbox</span>
      <span class="nav-badge" [hidden]="!sidebarOpen() || store.pendingCount() === 0">
        {{ store.pendingCount() }}
      </span>
    </button>
    <button
      type="button"
      class="nav-item"
      [class.active]="store.tab() === 'faqs'"
      (click)="store.setTab('faqs')"
      [attr.aria-current]="store.tab() === 'faqs' ? 'page' : null"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M8 9h8M8 12h8M8 15h5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="nav-label" [hidden]="!sidebarOpen()">Trained</span>
      <span class="nav-badge" [hidden]="!sidebarOpen() || store.faqCount() === 0">
        {{ store.faqCount() }}
      </span>
    </button>
    <button
      type="button"
      class="nav-item"
      [class.active]="store.tab() === 'merge'"
      (click)="store.setTab('merge')"
      [attr.aria-current]="store.tab() === 'merge' ? 'page' : null"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M7 7l-3 3 3 3M17 7l3 3-3 3M14 4l-4 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="nav-label" [hidden]="!sidebarOpen()">Merge</span>
      <span class="nav-badge" [hidden]="!sidebarOpen() || store.intentGroups().length === 0">
        {{ store.intentGroups().length }}
      </span>
    </button>
    <button
      type="button"
      class="nav-item"
      [class.active]="store.tab() === 'documents'"
      (click)="openDocuments()"
      [attr.aria-current]="store.tab() === 'documents' ? 'page' : null"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M14 2v6h6M16 13H8M16 17H8M10 9H8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="nav-label" [hidden]="!sidebarOpen()">Documents</span>
    </button>
  </nav>

  <div class="upload-section">
    <label class="upload-label">
      <input
        type="file"
        accept=".csv,.xlsx,.xls,.docx,.doc,.pdf,.txt"
        (change)="documents.uploadDocument($event)"
        [disabled]="store.uploading()"
      />
      <span class="upload-btn">
        @if (store.uploading()) {
          Uploading…
        } @else {
          Upload file
        }
      </span>
      <span class="upload-hint">csv, xlsx, docx, doc, pdf, txt</span>
    </label>
  </div>

  <div class="sidebar-footer">
    <a class="back-link" routerLink="/chat" [hidden]="!sidebarOpen()">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path
          d="M15 18l-6-6 6-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Back to chat
    </a>
  </div>
</aside>
