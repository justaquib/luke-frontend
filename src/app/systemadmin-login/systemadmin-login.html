<div class="auth-page">
  <section class="auth-card" aria-labelledby="systemadmin-title">
    <a routerLink="/" class="auth-brand">
      <span class="brand-mark" aria-hidden="true"><app-icon name="logo" [size]="18" /></span>
      <span>Luke Lab</span>
    </a>

    <header class="auth-header">
      <h1 id="systemadmin-title">Lab administrator</h1>
      <p class="auth-lead">Enter your PIN to sign in.</p>
    </header>

    <form class="auth-form" (ngSubmit)="login()">
      <div class="auth-field">
        <label class="auth-label" for="systemadminPin">PIN</label>
        <div class="auth-row">
          <input
            id="systemadminPin"
            type="text"
            class="auth-input"
            [(ngModel)]="pin"
            name="systemadminPin"
            inputmode="numeric"
            maxlength="6"
            placeholder="123456"
          />
          <button type="submit" class="icon-btn" aria-label="Sign in" title="Sign in">
            <app-icon name="check" [size]="16" />
          </button>
        </div>
      </div>
    </form>

    <nav class="auth-links" aria-label="Sign-in options">
      <a routerLink="/login" class="auth-link">
        <app-icon name="arrow-left" [size]="14" />
        Back to login
      </a>
    </nav>
  </section>
</div>
