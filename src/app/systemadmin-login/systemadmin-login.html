<div class="systemadmin-page">
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="36" height="36">
          <defs>
            <linearGradient id="bm-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bm-g)" />
          <path
            d="M9 12c0-1.5 1-3 3-3h8c2 0 3 1.5 3 3v6c0 1.5-1 3-3 3h-5l-3 3v-3h-0c-2 0-3-1.5-3-3z"
            fill="#fff"
            opacity="0.96"
          />
          <circle cx="13" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="17" cy="15" r="1.2" fill="#6366f1" />
          <circle cx="21" cy="15" r="1.2" fill="#6366f1" />
        </svg>
      </span>
      <span class="brand-name">Assistance</span>
    </div>

    <div class="login-header">
      <h1>System Admin</h1>
        <p class="login-lead">Enter your PIN to sign in.</p>
    </div>

    <div class="login-section">
      <form class="pin-form" (ngSubmit)="login()">
        <label class="pin-label" for="systemadminPin">PIN</label>
        <div class="pin-row">
          <input
            id="systemadminPin"
            type="text"
            class="pin-input"
            [(ngModel)]="pin"
            name="systemadminPin"
            inputmode="numeric"
            maxlength="6"
            placeholder="123456"
          />
          <button type="submit" class="pin-btn">Sign in</button>
        </div>
      </form>
    </div>

    <a routerLink="/login" class="back-link">← Back to login</a>
  </div>
</div>
